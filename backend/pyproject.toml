[project]
name = "civicflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.15",
  "shapely>=2.0",
  "apscheduler>=3.10,<4",
  "anthropic>=0.40",
  "pillow>=10.4",
  "piexif>=1.1.3",
  "imagehash>=4.3",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "freezegun>=1.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
